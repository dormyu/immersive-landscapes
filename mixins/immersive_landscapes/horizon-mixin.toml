# Lazy exact concentric-ring searches: ordinary local generation must not
# initialize all global stronghold biome searches (and remote IL basins).
[[module]]
id = "structure_rings"
file = "crates/horizon-world/src/worldgen/generator_structures.rs"
name = "immersive_landscapes_structure_rings"
source = "structure_rings.rs"
visibility = "pub(crate)"

[[injection]]
id = "structure_rings_help"
kind = "HEAD"
target = "horizon_world::worldgen::generator_structures::StructureState::rings"
helper = "structure_rings_help.rs"
bindings = [
  { name = "state", ty = "&StructureState", value = "&*self" },
  { name = "context", ty = "&mut impl super::structure::start::StartContext", value = "context" },
]

[[injection]]
id = "structure_build"
kind = "HEAD"
cancellable = true
